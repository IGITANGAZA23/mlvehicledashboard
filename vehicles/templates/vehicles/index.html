<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle ML Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .scrollspy-example {
            height: 80vh;
            overflow-y: scroll;
            position: relative;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#dashboard-nav" data-bs-offset="100" tabindex="0">
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-md-3">
                <div id="dashboard-nav" class="list-group position-sticky top-0">
                    <a class="list-group-item list-group-item-action" href="#frequency-table">
                        Frequency Tables (One-way)
                    </a>
                    <a class="list-group-item list-group-item-action" href="#price-filter">
                        Vehicles (Price > $5,000)
                    </a>
                </div>
            </div>
            <!-- Scrollable Content -->
            <div class="col-md-9">
                <div class="scrollspy-example" data-bs-spy="scroll" data-bs-target="#dashboard-nav" data-bs-smooth-scroll="true" tabindex="0">
                    <h1 class="text-center text-primary mb-4"> Vehicle Machine Learning Dashboard </h1>
                    
                    <!-- Frequency Table Card -->
                    <div id="frequency-table" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Frequency Tables (One-way)
                        </div>
                        <div class="card-body">
                            {{ frequency_table|safe }}
                        </div>
                    </div>

                    <!-- Filtered Vehicles by Price Card -->
                    <div id="price-filter" class="card shadow mb-5">
                        <div class="card-header bg-success text-white">
                            Vehicles with Price Above $5,000
                        </div>
                        <div class="card-body table-responsive" style="max-height: 500px; overflow-y: auto;">
                            {{ filtered_vehicles_table|safe }}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
